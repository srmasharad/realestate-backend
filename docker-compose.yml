services:
  postgres:
    image: postgres:17
    container_name: realetste_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: realetste_db
    ports:
      - "5432:5432"
    volumes:
      - realetste_postgres_data:/var/lib/postgresql/data

volumes:
  realetste_postgres_data:
